apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostel-mongo-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostel-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostel-mongodb
  template:
    metadata:
      labels:
        app: hostel-mongodb
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hostel-mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hostel-mongodb
spec:
  selector:
    app: hostel-mongodb
  ports:
    - port: 27017
      targetPort: 27017
