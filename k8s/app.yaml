apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostel-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hostel-management
  template:
    metadata:
      labels:
        app: hostel-management
    spec:
      containers:
        - name: app
          image: hostel-management:latest
          imagePullPolicy: IfNotPresent   # uses the image built locally (Docker Desktop / minikube)
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: mongodb://hostel-mongodb:27017/hostel_management
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hostel-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hostel-management
spec:
  type: NodePort
  selector:
    app: hostel-management
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
